apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: devops-task    
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        ports:
        - containerPort: 5432
        env:
            - name: POSTGRES_DB
              value: devopsdb
            - name: POSTGRES_USER
              value: devopsclsuser
            - name: POSTGRES_PASSWORD
              value: devopspassword
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-task
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432