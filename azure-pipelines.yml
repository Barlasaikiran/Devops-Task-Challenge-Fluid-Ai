trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepo: 'javapp'
  dockerfilePath: 'app/Dockerfile'
  imageTag: $(Build.BuildId)

  acr-service-connection: 'acr-devops-connection'
  aks-service-connection: 'HDFC-Manual'

  aks-resource-group: 'Devops-Aks'
  aks-cluster-name: 'devops-aks'
  aks-namespace: 'devops-task'

stages:

# Build and push the Docker image

- stage: BuildAndPush
  displayName: Build and Push Docker Image

  jobs:
  - job: DockerBuildAndPush
    displayName: Build and Push Docker Image

    steps:

    - checkout: self

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: $(acr-service-connection)
        repository: $(imageRepo)
        command: buildAndPush
        Dockerfile: $(dockerfilePath)
        tags: |
          latest
          $(imageTag)


# Deploy the application to AKS

- stage: DeployToAKS
  displayName: Deploy to AKS

  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:
  - job: Deploy
    displayName: Deploy Backend to AKS

    steps:

    # Get AKS credentials

    - task: AzureCLI@2
      displayName: Get AKS Credentials
      inputs:
        azureSubscription: $(aks-service-connection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          az aks get-credentials \
            --resource-group $(aks-resource-group) \
            --name $(aks-cluster-name) \
            --overwrite-existing


    # Apply Kubernetes manifests

    - task: AzureCLI@2
      displayName: Apply Kubernetes Manifests
      inputs:
        azureSubscription: $(aks-service-connection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f k8s/postgress.yaml

          kubectl apply -f k8s/service-account.yaml

          kubectl apply -f k8s/secret-provider-class.yaml

          kubectl apply -f k8s/deployment.yaml


    # Verify the backend deployment

    - task: AzureCLI@2
      displayName: Verify Backend Deployment
      inputs:
        azureSubscription: $(aks-service-connection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          echo "Waiting for backend rollout..."

          kubectl rollout status deployment/backend \
            --namespace $(aks-namespace) \
            --timeout=180s


    # Show Kubernetes status

    - task: AzureCLI@2
      displayName: Show Kubernetes Status
      condition: always()
      inputs:
        azureSubscription: $(aks-service-connection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          echo "Kubernetes pods"

          kubectl get pods \
            --namespace $(aks-namespace) \
            -o wide

          echo "Backend deployment"

          kubectl get deployment backend \
            --namespace $(aks-namespace)

          echo "Backend ReplicaSets"

          kubectl get rs \
            --namespace $(aks-namespace)