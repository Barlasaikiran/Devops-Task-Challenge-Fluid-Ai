trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepo: 'javapp'
  dockerfilePath: 'app/Dockerfile'
  imageTag: $(Build.BuildId)
  acr-service-connection: 'acr-devops-connection'
  aks-service-connection: 'HDFC-Manual'

stages:
  - stage: BuildAndPush
    displayName: Build and Push Docker Image

    jobs:
      - job: DockerBuildandPush
        displayName: Build and Push Docker Image

        steps:
          - checkout: self
          - task: Docker@2
            displayName: Docker Build and Push
            inputs:
             containerRegistry: $(acr-service-connection)
             repository: '$(imageRepo)'
             command: 'buildAndPush'
             Dockerfile: '$(dockerfilePath)'
             tags: |
               latest
               $(imageTag)

  - stage: DeployToAKS
    displayName: Deploy to AKS

    dependsOn: BuildAndPush

    jobs:
      - job: Deploy
        displayName: Deploy Backend to AKS

        steps:

          - task: AzureCLI@2
            displayName: Deploy to AKS
            inputs:
              azureSubscription: $(aks-service-connection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |

                az aks get-credentials \
                  --resource-group Devops-Aks \
                  --name devops-aks \
                  --overwrite-existing

                kubectl set image deployment/backend \
                  backend=acrregistery.azurecr.io/javapp:$(Build.BuildId) \
                  -n devops-task

                kubectl rollout status deployment/backend \
                  -n devops-task \
                  --timeout=180s